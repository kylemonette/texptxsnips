trigger:
- main

pool:
  vmImage: 'ubuntu-latest' # Launches a clean, temporary Linux container to build your code

steps:
# 1. Pull down your project files from source control
- checkout: self

# 2. Spin up a clean Node.js workspace environment 
- task: NodeTool@0
  inputs:
    versionSpec: '20.x' # Tailor this version to match your extension's requirements
  displayName: 'Install Node.js'

# 3. Download dependencies and run your compilation build scripts
- script: |
    npm install
    npm run compile
  displayName: 'Install dependencies and compile project'

# 4. Use your identity link to securely bundle and publish without any secrets or PATs
- task: AzureCLI@2
  displayName: 'Publish to VS Code Marketplace'
  inputs:
    azureSubscription: 'Service Connection KM'
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      # Install the official packaging utility globally inside the cloud runner
      npm install -g @vscode/vsce
      
      # Publish using the managed identity session token injected by the AzureCLI task
      vsce publish --azure-credential

